name: 🚀 续一次火

on:
  workflow_dispatch:
  schedule:
    - cron: "21 0 * * *"
      timezone: "Asia/Shanghai"

jobs:
  run:
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    timeout-minutes: 30

    steps:
      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v7

      - name: 安装 unzip (Install unzip)
        run: apt-get update && apt-get install -y unzip

      - name: 安装 Bun (Set up Bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装运行时依赖 (Install dependencies)
        run: |
            rm -f package-lock.json
            bun install --production --ignore-scripts

      - name: 续一次火 (Run spark job)
        env:
          DOUYIN_ACCOUNTS: ${{ secrets.DOUYIN_ACCOUNTS }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_TARGET_NAMES: ${{ secrets.DOUYIN_TARGET_NAMES }}
          YIYAN_INCLUDE_SOURCE: ${{ secrets.YIYAN_INCLUDE_SOURCE }}
          SPARK_MESSAGE_TEMPLATE: ${{ secrets.SPARK_MESSAGE_TEMPLATE }}
        run: bun src/main.ts

      - name: 上传失败截图 (Upload screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-$(date +%Y%m%d-%H%M%S)
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
